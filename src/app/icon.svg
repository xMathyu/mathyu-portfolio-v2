<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Brand gradient, same stops as --ai-gradient -->
    <linearGradient id="orb" x1="10" y1="12" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0894ff"/>
      <stop offset="0.38" stop-color="#c959dd"/>
      <stop offset="0.7" stop-color="#ff2e54"/>
      <stop offset="1" stop-color="#ff9004"/>
    </linearGradient>
    <!-- Specular highlight so it reads as the 3D orb from the hero -->
    <radialGradient id="shine" cx="0.32" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#c959dd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c959dd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#000"/>
  <circle cx="32" cy="32" r="29" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="22" fill="url(#orb)"/>
  <circle cx="32" cy="32" r="22" fill="url(#shine)"/>
  <path d="M22.5 41.5V23.5L32 34l9.5-10.5v18" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
